<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Octet architecture</title>
  <desc id="desc">Octet's native workspace, terminal, and conversation views connect to the Herdr session server and installed agent command line tools, which retain their own configuration and transcripts.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" class="arrowhead"/>
    </marker>
    <style>
      .canvas { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #dfe3e8; }
      .card { fill: #f4f6f8; stroke: #dfe3e8; }
      .core { fill: #0f9bc6; stroke: #0f87ad; }
      .ink { fill: #171a1e; }
      .muted { fill: #68717b; }
      .onCore { fill: #ffffff; }
      .onCoreMuted { fill: #d7f5ff; }
      .accent { fill: #0782aa; }
      .line { fill: none; stroke: #8a949f; stroke-width: 2; marker-end: url(#arrow); }
      .link { fill: none; stroke: #8a949f; stroke-width: 2; stroke-dasharray: 6 7; marker-end: url(#arrow); }
      .arrowhead { fill: #8a949f; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0e0f11; }
        .panel { fill: #151719; stroke: #30343a; }
        .card { fill: #1b1e22; stroke: #34383f; }
        .core { fill: #118db4; stroke: #25add5; }
        .ink { fill: #f2f4f6; }
        .muted { fill: #9aa2ac; }
        .accent { fill: #45c6ed; }
        .line, .link { stroke: #68727e; }
        .arrowhead { fill: #68727e; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="650" rx="24"/>
  <text x="54" y="58" class="ink" font-size="25" font-weight="700">How Octet runs</text>
  <text x="54" y="83" class="muted" font-size="14">The native app coordinates persistent terminals and each agent's own runtime.</text>

  <rect class="panel" x="42" y="112" width="1116" height="160" rx="18"/>
  <text x="66" y="143" class="accent" font-size="12" font-weight="750" letter-spacing="1.6">OCTET.APP · NATIVE INTERFACE</text>
  <rect class="card" x="66" y="162" width="332" height="84" rx="13"/>
  <text x="88" y="193" class="ink" font-size="18" font-weight="700">Workspace</text>
  <text x="88" y="220" class="muted" font-size="14">Projects · tabs · commands</text>
  <rect class="card" x="434" y="162" width="332" height="84" rx="13"/>
  <text x="456" y="193" class="ink" font-size="18" font-weight="700">Terminal</text>
  <text x="456" y="220" class="muted" font-size="14">GhosttyKit GPU surface</text>
  <rect class="card" x="802" y="162" width="332" height="84" rx="13"/>
  <text x="824" y="193" class="ink" font-size="18" font-weight="700">Conversations</text>
  <text x="824" y="220" class="muted" font-size="14">Tools · diffs · approvals · answers</text>

  <path class="line" d="M232 246 V319"/>
  <path class="line" d="M600 246 V319"/>
  <path class="line" d="M968 246 V319"/>
  <text x="248" y="297" class="muted" font-size="12">commands + snapshots</text>
  <text x="616" y="297" class="muted" font-size="12">terminal stream</text>
  <text x="984" y="297" class="muted" font-size="12">native protocols</text>

  <rect class="core" x="66" y="320" width="700" height="116" rx="16"/>
  <text x="92" y="353" class="onCore" font-size="12" font-weight="750" letter-spacing="1.5">PERSISTENT TERMINAL RUNTIME</text>
  <text x="92" y="385" class="onCore" font-size="22" font-weight="700">Herdr session server</text>
  <text x="92" y="412" class="onCoreMuted" font-size="14">Owns workspaces, tabs, panes, PTYs, snapshots, and recovery.</text>
  <rect x="594" y="350" width="142" height="56" rx="28" fill="#ffffff" fill-opacity=".15" stroke="#ffffff" stroke-opacity=".28"/>
  <circle cx="622" cy="378" r="6" fill="#8be5ff"/>
  <text x="640" y="383" class="onCore" font-size="13" font-weight="700">socket API</text>

  <rect class="panel" x="802" y="320" width="332" height="116" rx="16"/>
  <text x="828" y="353" class="accent" font-size="12" font-weight="750" letter-spacing="1.5">AGENT RUNTIMES</text>
  <text x="828" y="385" class="ink" font-size="22" font-weight="700">Installed agent CLIs</text>
  <text x="828" y="412" class="muted" font-size="14">Claude · Codex · OpenCode · Pi · Qwen</text>
  <path class="link" d="M766 378 H802"/>
  <text x="752" y="365" text-anchor="end" class="onCoreMuted" font-size="11">agent state</text>

  <path class="line" d="M416 436 V510"/>
  <path class="line" d="M968 436 V510"/>
  <text x="432" y="480" class="muted" font-size="12">survives app windows</text>
  <text x="984" y="480" class="muted" font-size="12">read and write in place</text>

  <rect class="panel" x="66" y="511" width="700" height="101" rx="16"/>
  <text x="92" y="544" class="accent" font-size="12" font-weight="750" letter-spacing="1.5">PERSISTENT SESSION</text>
  <text x="92" y="576" class="ink" font-size="20" font-weight="700">Workspaces, shells, scrollback, and running processes</text>
  <text x="92" y="599" class="muted" font-size="13">Close Octet and return to the same session later.</text>

  <rect class="panel" x="802" y="511" width="332" height="101" rx="16"/>
  <text x="828" y="544" class="accent" font-size="12" font-weight="750" letter-spacing="1.5">NATIVE AGENT DATA</text>
  <text x="828" y="576" class="ink" font-size="19" font-weight="700">Config, tools, MCP, skills</text>
  <text x="828" y="599" class="muted" font-size="13">Credentials and transcripts stay native.</text>
</svg>
