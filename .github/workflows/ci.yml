# Builds Octet and runs its tests on every pull request and on master.
# Unsigned (ad hoc), so it needs no secrets and runs on forks too.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The plugins, for the tests that load them.
      - name: Check out the plugins
        uses: actions/checkout@v4
        with:
          repository: JackTPatterson/octet-plugins
          path: octet-plugins

      - uses: ./.github/actions/setup

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Octet.xcodeproj \
            -scheme Octet \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee build/test.log | grep -E "^(Test Suite|Test Case .*(failed|error)|.*error:|\*\* )" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/Tests.xcresult
            build/test.log
          retention-days: 7
