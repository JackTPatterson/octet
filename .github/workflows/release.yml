# Production: every push to the `release` branch builds, tests, signs,
# notarizes and publishes Octet, then points Sparkle's appcast on master at
# the new version so installed copies update.
#
# Promote what's on master with a pull request from master into release,
# or `git push origin master:release`. Bump CURRENT_PROJECT_VERSION in
# project.yml first: Sparkle only offers a higher build number, and a
# version that's already published stops the run before it signs anything.
#
# The deploy job runs in the `production` environment (Settings ›
# Environments), which holds the secrets and can require an approval:
#   DEVELOPER_ID_P12_BASE64    Developer ID Application certificate and its
#                              private key, exported as .p12, base64-encoded
#   DEVELOPER_ID_P12_PASSWORD  the .p12's password
#   APPLE_ID                   the Apple ID notarization runs as
#   APPLE_TEAM_ID              its team (P8FLGJ3757, as in project.yml)
#   APPLE_APP_PASSWORD         an app-specific password for that Apple ID
#   SPARKLE_ED_PRIVATE_KEY     Sparkle's EdDSA private key, as
#                              `generate_keys -x <file>` exports it
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

# One release at a time, and never cancel one halfway through notarizing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The plugins, for the tests that load them, as CI checks them out.
      - name: Check out the plugins
        uses: actions/checkout@v4
        with:
          repository: JackTPatterson/octet-plugins
          path: octet-plugins

      - uses: ./.github/actions/setup

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Octet.xcodeproj \
            -scheme Octet \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee build/test.log | grep -E "^(Test Suite|Test Case .*(failed|error)|.*error:|\*\* )" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

  deploy:
    name: Sign, notarize and publish
    needs: test
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name the signing keychain
        run: echo "KEYCHAIN=$RUNNER_TEMP/octet-release.keychain-db" >> "$GITHUB_ENV"

      - name: Work out the version
        id: version
        run: |
          value() { sed -n "s/^ *$1: *\"\(.*\)\"/\1/p" project.yml | head -1; }
          short="$(value MARKETING_VERSION)"
          build="$(value CURRENT_PROJECT_VERSION)"
          pre="$(value OCTET_PRERELEASE)"
          if [ -n "$pre" ]; then tag="v$short-$pre.$build"; else tag="v$short"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already published. Bump CURRENT_PROJECT_VERSION (and MARKETING_VERSION for a new version) in project.yml, then push to release again."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "title=Octet $short${pre:+ $pre $build}"
            echo "prerelease=$([ -n "$pre" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: ./.github/actions/setup

      - name: Install the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$KEYCHAIN" >/dev/null
          # First in the search list and the default, so xcodebuild,
          # codesign and notarytool all find it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store the notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials octet-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN"

      - name: Write Sparkle's signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-ed-key"

      # Installed copies read the appcast from master, so the new entry is
      # added to master's, keeping every version already there.
      - name: Start from master's appcast
        run: git show origin/master:appcast.xml > appcast.xml

      - name: Build, sign and notarize
        env:
          OCTET_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          OCTET_NOTARY_KEYCHAIN: ${{ env.KEYCHAIN }}
          OCTET_SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle-ed-key
        run: scripts/release.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/build.log
          retention-days: 30

      - name: Publish the GitHub release
        id: publish
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags="--generate-notes"
          [ "$PRERELEASE" = true ] && flags="$flags --prerelease"
          gh release create "$TAG" build/release/*.dmg build/release/*.zip \
            --target "$GITHUB_SHA" --title "$TITLE" $flags
          echo "url=$(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      # Only after the release is up, so the feed never names a download
      # that isn't there yet.
      - name: Point the appcast at it
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B appcast-update origin/master
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          git add appcast.xml
          git commit -m "Appcast: $TAG"
          git push origin HEAD:master

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sparkle-ed-key"
