name: Octet
options:
  bundleIdPrefix: com.jpxsoftware
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    # A real team, so macOS keeps a keychain "Always Allow" across builds.
    # Ad-hoc signing ("-") pinned every grant to one build's hash, and each
    # rebuild asked again.
    DEVELOPMENT_TEAM: P8FLGJ3757
    # The generated Info.plist takes its version from these; without them
    # the app ships with no version at all.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
    # The release stage shown beside the sidebar button; empty for a
    # stable release, which shows none.
    OCTET_PRERELEASE: "alpha"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Distribution outside the App Store: notarization requires Developer
      # ID signing, the hardened runtime, and a secure timestamp.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Xcode otherwise signs in get-task-allow (the debugger entitlement),
      # which notarization rejects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Apple silicon only: GhosttyKit and the terminal engine are vendored
      # as arm64 builds, so an Intel slice has nothing to link against.
      ARCHS: arm64
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Octet:
    type: application
    platform: macOS
    sources:
      - path: Octet
      - path: Shared
      # Octet's own bundled plugins, copied as folders into Resources/Plugins.
      - path: Plugins
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: UniformTypeIdentifiers.framework
      - target: octet-cli
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jpxsoftware.octet
        PRODUCT_NAME: Octet
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Octet/Info.plist
        # Built from the layered Icon Composer source at Octet/AppIcon.icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-lc++"
        ENABLE_APP_SANDBOX: NO
      configs:
        # Privacy grants (Files and Folders, Music, …) are stored per bundle
        # ID together with the signing requirement. Debug is signed with the
        # development certificate and Release with Developer ID, so under one
        # ID each build overwrote the other's grant, and switching between
        # them asked for every permission again.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jpxsoftware.octet.debug
    postBuildScripts:
      - name: Bundle terminal engine
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Vendor/engine/octet-engine
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/octet-engine
        script: |
          set -eu
          source="$SRCROOT/Vendor/engine/octet-engine"
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/octet-engine"
          if [ ! -x "$source" ]; then
            echo "error: $source is missing. Run scripts/fetch-engine.sh first."
            exit 1
          fi
          mkdir -p "$(dirname "$dest")"
          rm -f "$dest"
          cp "$source" "$dest"
          chmod 755 "$dest"
          # Signed with the build's own identity: nested code signed ad hoc
          # fails notarization, and Release adds the hardened runtime and a
          # timestamp as notarization requires.
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$CONFIGURATION" = "Release" ]; then
            codesign --force --sign "$identity" --options runtime --timestamp "$dest"
          else
            codesign --force --sign "$identity" "$dest"
          fi
  octet-cli:
    type: tool
    platform: macOS
    sources:
      - path: OctetCLI
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: octet-cli
  OctetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OctetTests
      - path: Shared
    dependencies:
      - target: Octet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jpxsoftware.octet.tests
schemes:
  Octet:
    build:
      targets:
        Octet: all
    run:
      config: Debug
    test:
      targets:
        - OctetTests
  OctetCore:
    build:
      targets:
        octet-cli: all
        OctetTests: [test]
    test:
      targets:
        - OctetTests
