name: TerminalSpike
options:
  bundleIdPrefix: com.jpxsoftware
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
targets:
  TerminalSpike:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../../Octet/Terminal
    dependencies:
      - framework: ../../Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jpxsoftware.octet.terminalspike
        PRODUCT_NAME: TerminalSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        OTHER_LDFLAGS: "-lc++"
        ENABLE_APP_SANDBOX: NO
schemes:
  TerminalSpike:
    build:
      targets:
        TerminalSpike: all
    run:
      config: Debug
